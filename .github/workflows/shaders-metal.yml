name: shaders-metal
on:
  push:
    paths:
      - 'packages/shaders/**'
      - 'packages/shaders-metal/**'
      - 'packages/shaders-metal-swift/**'
      - '.github/workflows/shaders-metal.yml'
  pull_request:
    paths:
      - 'packages/shaders/**'
      - 'packages/shaders-metal/**'
      - 'packages/shaders-metal-swift/**'

concurrency:
  group: shaders-metal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-gate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install shader tools
        run: brew install glslang spirv-tools spirv-cross
      - run: bun install
      - name: Doctor
        run: cd packages/shaders-metal && bun run doctor
      - name: Build dist artifacts
        run: cd packages/shaders-metal && bun run build
      - name: Tests (includes 29/29 golden gate)
        run: cd packages/shaders-metal && bun test

  swift-runtime:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install shader tools
        run: brew install glslang spirv-tools spirv-cross
      - run: bun install
      - name: Build dist artifacts
        run: cd packages/shaders-metal && bun run build
      - name: Skill doc freshness
        run: |
          cd packages/shaders-metal && bun run skill
          git diff --exit-code ../../.claude/skills/paper-shaders-metal/SKILL.md
      - name: Swift build
        run: cd packages/shaders-metal-swift && swift build
      - name: Snippet typecheck
        run: cd packages/shaders-metal && bun run typecheck-snippet
      - name: Swift tests
        run: cd packages/shaders-metal-swift && swift test
