name: release-preview-app
on:
  push:
    tags: ['preview-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install shader tools
        run: brew install glslang spirv-tools spirv-cross
      - run: bun install
      - name: Build dist artifacts
        run: cd packages/shaders-metal && bun run build
      - name: Build app bundle
        run: ./scripts/make-app-bundle.sh "${GITHUB_REF_NAME#preview-v}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-app/PaperShadersMetal-*.zip
          generate_release_notes: true
